<script src="../assets/global/js/iziToast.min.js"></script>

<script>
    "use strict";
    const colors = {
        success: '#28c76f',
        error: '#eb2222',
        warning: '#ff9f43',
        info: '#1e9ff2',
    }

    const icons = {
        success: 'fas fa-check-circle',
        error: 'fas fa-times-circle',
        warning: 'fas fa-exclamation-triangle',
        info: 'fas fa-exclamation-circle',
    }

    const notifications = [];
    const errors = [];


    const triggerToaster = (status, message) => {
        iziToast[status]({
            title: status.charAt(0).toUpperCase() + status.slice(1),
            message: message,
            position: "topRight",
            backgroundColor: '#fff',
            icon: icons[status],
            iconColor: colors[status],
            progressBarColor: colors[status],
            titleSize: '1rem',
            messageSize: '1rem',
            titleColor: '#474747',
            messageColor: '#a2a2a2',
            transitionIn: 'obunceInLeft'
        });
    }

    if (notifications.length) {
        notifications.forEach(element => {
            triggerToaster(element[0], element[1]);
        });
    }

    if (errors.length) {
        errors.forEach(error => {
            triggerToaster('error', error);
        });
    }

    function notify(status, message) {
        if (typeof message == 'string') {
            triggerToaster(status, message);
        } else {
            $.each(message, (i, val) => triggerToaster(status, val));
        }
    }
</script>

        (function($) {
            "use strict";

            $('.change-lang').on('click', function(e) {
                let langCode = $(this).data('code');
                window.location.href = "https://nexustradex.net/trades/change/" + langCode;
            });

                            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                    let windowsIsDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (windowsIsDarkTheme) {
                        setTheme('light');
                    } else {
                        setTheme('dark');
                    }
                });

                const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
                const currentTheme = localStorage.getItem('theme');

                if (currentTheme) {
                    setTheme(currentTheme);
                } else {
                    let defaultTheme = `light`;

                    if (defaultTheme == 'dark') {
                        setTheme('dark');
                    } else {
                        setTheme('light');
                    }
                }

                function setTheme(theme) {
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                    theme == 'dark' ? toggleSwitch.checked = true : toggleSwitch.checked = false;
                }

                toggleSwitch.addEventListener('change', function(e) {
                    setTheme(e.target.checked ? 'dark' : 'light');
                });
            
            var inputElements = $('input,select');
            $.each(inputElements, function(index, element) {
                element = $(element);

            });
